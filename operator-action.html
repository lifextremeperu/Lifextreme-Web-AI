<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de Reserva | Lifextreme Adventure Partner</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6 antialiased selection:bg-cyan-500">
    
    <div class="max-w-md w-full mx-auto my-auto">
        
        <!-- TARJETA DE ESTADO -->
        <div id="status-card" class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl text-center relative overflow-hidden transition-all duration-300">
            
            <div id="status-icon" class="h-16 w-16 mx-auto rounded-2xl bg-slate-800 text-slate-400 flex items-center justify-center text-3xl mb-4">
                ⏳
            </div>

            <span id="status-badge" class="text-[10px] uppercase tracking-widest font-extrabold text-slate-400 bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
                PROCESANDO ACCIÓN...
            </span>

            <h1 id="status-title" class="text-2xl font-black text-white mt-3">
                Verificando Orden...
            </h1>

            <p id="status-desc" class="text-xs text-slate-300 mt-2 leading-relaxed">
                Por favor espera mientras confirmamos tu disponibilidad en el sistema.
            </p>

            <div class="my-5 border-t border-slate-800"></div>

            <!-- DETALLES DE LA RESERVA -->
            <div class="bg-slate-950/80 rounded-2xl p-4 text-left space-y-2 text-xs border border-slate-800">
                <div class="flex justify-between items-center">
                    <span class="text-slate-400">Código de Reserva:</span>
                    <span id="booking-id" class="font-mono font-bold text-cyan-400">Cargando...</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400">Estado:</span>
                    <span id="booking-status" class="font-bold text-slate-300">Consultando...</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400">Fecha de confirmación:</span>
                    <span id="booking-time" class="text-slate-200">-</span>
                </div>
            </div>

            <!-- BOTÓN DE ACCIÓN WHATSAPP -->
            <div id="action-container" class="mt-6 space-y-3">
                <!-- Inyectado por JS -->
            </div>

        </div>

    </div>

    <footer class="text-center text-[11px] text-slate-500 py-4">
        Lifextreme Web AI • Red Descentralizada de Operadores de Aventura en Cusco
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const action = (params.get('action') || 'accept').toLowerCase();
            const id = params.get('id') || 'LFX-' + Math.floor(Math.random() * 9000 + 1000);
            const op = params.get('op') ? decodeURIComponent(params.get('op')) : 'Operador Certificado';

            const card = document.getElementById('status-card');
            const icon = document.getElementById('status-icon');
            const badge = document.getElementById('status-badge');
            const title = document.getElementById('status-title');
            const desc = document.getElementById('status-desc');
            const bookingId = document.getElementById('booking-id');
            const bookingStatus = document.getElementById('booking-status');
            const bookingTime = document.getElementById('booking-time');
            const actionContainer = document.getElementById('action-container');

            bookingId.textContent = id;
            bookingTime.textContent = new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' }) + ' hrs';

            if (action === 'accept') {
                card.className = "bg-slate-900 border border-emerald-500/40 shadow-emerald-500/10 rounded-3xl p-6 sm:p-8 shadow-2xl text-center relative overflow-hidden transition-all duration-300";
                icon.className = "h-16 w-16 mx-auto rounded-2xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-3xl mb-4";
                icon.textContent = "✔";
                badge.className = "text-[10px] uppercase tracking-widest font-extrabold text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20";
                badge.textContent = "OPERACIÓN CONFIRMADA";
                title.textContent = "¡Reserva Asignada a ti!";
                desc.innerHTML = `Gracias, <strong class="text-white">${op}</strong>. El turista ya fue notificado de tu confirmación por WhatsApp y los datos del recojo quedaron sincronizados.`;
                bookingStatus.className = "font-bold text-emerald-400";
                bookingStatus.textContent = "CONFIRMADO (En Ruta)";

                actionContainer.innerHTML = `
                    <a href="https://wa.me/51958050928?text=Hola%20Central%20Lifextreme!%20He%20aceptado%20la%20reserva%20${id}.%20Quedo%20a%20la%20espera%20de%20los%20detalles%20de%20recojo." 
                       target="_blank"
                       class="w-full py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 transition-all">
                        <span>📱 Contactar a Central de Despacho</span>
                    </a>
                `;
            } else {
                card.className = "bg-slate-900 border border-amber-500/40 shadow-amber-500/10 rounded-3xl p-6 sm:p-8 shadow-2xl text-center relative overflow-hidden transition-all duration-300";
                icon.className = "h-16 w-16 mx-auto rounded-2xl bg-amber-500/20 text-amber-400 border border-amber-500/30 flex items-center justify-center text-3xl mb-4";
                icon.textContent = "✕";
                badge.className = "text-[10px] uppercase tracking-widest font-extrabold text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20";
                badge.textContent = "DISPONIBILIDAD AGOTADA";
                title.textContent = "Reserva Liberada";
                desc.innerHTML = `Entendido, <strong class="text-white">${op}</strong>. El sistema reasignará la solicitud a otro operador disponible en Cusco.`;
                bookingStatus.className = "font-bold text-amber-400";
                bookingStatus.textContent = "RECHAZADO (Reasignando)";

                actionContainer.innerHTML = `
                    <a href="/" class="text-xs text-slate-400 hover:text-white underline">
                        Volver al portal Lifextreme
                    </a>
                `;
            }
        });
    </script>
</body>
</html>
