# MediaMTX Configuration for Lifextreme Video Bridge
# Docs: https://github.com/bluenviron/mediamtx

logLevel: info
logDestinations: [stdout]

# HLS output configuration for Web browsers
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ['*']
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s

# WebRTC output configuration
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['*']

# RTSP input configuration
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

paths:
  # Canal 1: Plaza Mayor de Cusco
  plaza_mayor:
    source: publisher

  # Canal 2: Santuario Machu Picchu
  machu_picchu:
    source: publisher

  # Canal 3: Paso Nevado Salkantay
  salkantay:
    source: publisher

  # Canal 4: Base Operativa San Blas Cusco
  base_san_blas:
    source: publisher

  # Canal general
  all:
