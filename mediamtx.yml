# MediaMTX Configuration for Lifextreme Video Bridge
# Docs: https://github.com/bluenviron/mediamtx

logLevel: info
logDestinations: [stdout]

# HLS output configuration for Web browsers
hls: yes
hlsAddress: :8888
hlsAllowOrigin: '*'
hlsAlwaysRemux: yes
hlsSegmentCount: 5
hlsSegmentDuration: 2s

# WebRTC output configuration
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: '*'

# RTSP input configuration
rtsp: yes
rtspAddress: :8554

paths:
  # Canal 1: Plaza Mayor de Cusco
  plaza_mayor:
    source: publisher
    runOnInit: ""
    runOnInitRestart: no

  # Canal 2: Santuario Machu Picchu
  machu_picchu:
    source: publisher

  # Canal 3: Paso Nevado Salkantay
  salkantay:
    source: publisher

  # Canal 4: Base Operativa San Blas Cusco
  base_san_blas:
    source: publisher

  # Canal de prueba de respaldo (Always on HLS stream)
  all:
