version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: lifextreme-os-web
    ports:
      - "80:80"
    volumes:
      - ./:/usr/share/nginx/html
    restart: unless-stopped

  api:
    build: 
      context: ./api
      dockerfile: Dockerfile
    container_name: lifextreme-os-api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    volumes:
      - ./api:/app
      - ./src:/src
