services:

  # ── Redis (requerido por Evolution API v2.3.7) ────────────
  evolution-redis:
    image: redis:7-alpine
    container_name: lifextreme_evo_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL liviano para Evolution API ─────────────────
  evolution-postgres:
    image: postgres:15-alpine
    container_name: lifextreme_evo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       evolution_db
      POSTGRES_USER:     evolution_user
      POSTGRES_PASSWORD: lx_evo_2026
    volumes:
      - evo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution_user -d evolution_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Evolution API v2 ──────────────────────────────────────
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: lifextreme_evolution
    restart: unless-stopped
    ports:
      - "8090:8080"
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    environment:
      # ── Seguridad ──────────────────────────────────────────
      AUTHENTICATION_API_KEY: "lifextreme_evo_2026"

      # ── Redis cache (Evolution API v2.3.7) ─────────────────
      CACHE_REDIS_ENABLED:      "true"
      CACHE_REDIS_URI:          "redis://evolution-redis:6379"
      CACHE_REDIS_PREFIX_KEY:   "lifextreme"
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED:      "false"
      # ── Base de datos ──────────────────────────────────────
      DATABASE_ENABLED:        "true"
      DATABASE_PROVIDER:       "postgresql"
      DATABASE_CONNECTION_URI: "postgresql://evolution_user:lx_evo_2026@evolution-postgres:5432/evolution_db"
      DATABASE_SAVE_DATA_INSTANCE:    "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE:   "false"
      DATABASE_SAVE_DATA_CONTACTS:    "true"
      DATABASE_SAVE_DATA_CHATS:       "true"

      # ── Comportamiento seguro (simula cliente real) ────────
      CONFIG_SESSION_PHONE_CLIENT: "Lifextreme"
      CONFIG_SESSION_PHONE_NAME:   "Chrome"

      # ── Webhook hacia LUCA (puente en puerto 8081) ─────────
      WEBHOOK_GLOBAL_URL:             "http://host.docker.internal:8081/webhook/evolution"
      WEBHOOK_GLOBAL_ENABLED:         "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"

      # ── Eventos que activan el webhook ────────────────────
      WEBHOOK_EVENTS_MESSAGES_UPSERT:   "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE:   "false"
      WEBHOOK_EVENTS_SEND_MESSAGE:      "false"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED:    "true"

      # ── Logs ──────────────────────────────────────────────
      LOG_LEVEL: "ERROR"
      LOG_COLOR:  "true"

    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  evo_postgres_data:
  evolution_instances:
  evolution_store:
  evolution_redis_data:
