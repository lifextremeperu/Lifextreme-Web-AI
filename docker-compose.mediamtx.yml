services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: lifextreme-stream-mediamtx
    restart: always
    ports:
      - "8554:8554" # RTSP Ingest
      - "8888:8888" # HLS Output (.m3u8)
      - "8889:8889" # WebRTC Output
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    networks:
      - lifextreme-net

networks:
  lifextreme-net:
    driver: bridge
